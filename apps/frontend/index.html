<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A fast, simple offline-ready spaced repetition PWA. Import Anki decks and review with FSRS."
    />
    <meta name="theme-color" content="#33272a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // The stored Mochi theme, before first paint: no flash of the default
      // tint on reload. Mirrors `readTheme` in `src/lib/theme.ts`.
      try {
        var storedTheme = localStorage.getItem('nook:theme')
        var knownThemes = ['mochi-pink', 'mochi-peach', 'mochi-sage', 'mochi-sky', 'mochi-lilac']
        document.documentElement.dataset.theme =
          storedTheme !== null && knownThemes.indexOf(storedTheme) !== -1
            ? storedTheme
            : 'mochi-pink'
      } catch (error) {
        document.documentElement.dataset.theme = 'mochi-pink'
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link href="/src/styles.css" rel="stylesheet" />
    <title>nook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
